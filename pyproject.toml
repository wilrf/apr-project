[project]
name = "nfl-upset-prediction"
version = "0.1.0"
description = "Multi-architecture model disagreement for NFL upset prediction"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Wil Fowler" }]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "nfl-data-py>=0.3.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",
    "shap>=0.42.0",
    "mlflow>=2.8.0",
]

[project.optional-dependencies]
lstm = ["torch>=2.0.0"]
dashboard = ["fastapi>=0.110.0", "uvicorn>=0.29.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-q --tb=short"

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
files = ["src"]
# Pragmatic start: do not require full annotations yet.
disallow_untyped_defs = false
check_untyped_defs = false
